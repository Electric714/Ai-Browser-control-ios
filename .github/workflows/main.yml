name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  PROJECT_PATH: Telescopure.xcodeproj
  SCHEME: Telescopure
  CONFIGURATION: Release
  SDK: iphoneos
  DESTINATION: generic/platform=iOS
  XCODE_VERSION: '26.2'
  ARCHIVE_PATH: ${{ github.workspace }}/build/Telescopure.xcarchive
  DERIVED_DATA_PATH: ${{ github.workspace }}/build/DerivedData
  SPM_CACHE_PATH: ${{ github.workspace }}/.spm
  IPA_OUTPUT_DIR: ${{ github.workspace }}/build
  IPA_NAME: Telescopure-unsigned.ipa

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.SPM_CACHE_PATH }}
          key: ${{ runner.os }}-spm-${{ env.XCODE_VERSION }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ env.XCODE_VERSION }}-

      - name: Resolve Swift packages
        run: |
          set -euxo pipefail
          mkdir -p "$SPM_CACHE_PATH"
          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$SPM_CACHE_PATH"

      - name: Build archive (unsigned)
        run: |
          set -euxo pipefail
          mkdir -p "$IPA_OUTPUT_DIR"

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk "$SDK" \
            -destination "$DESTINATION" \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SPM_CACHE_PATH" \
            clean archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail

          APP_PATH="$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name "*.app" -print -quit)"
          if [ -z "${APP_PATH}" ]; then
            echo "❌ .app not found in archive Products/Applications"
            find "$ARCHIVE_PATH" -maxdepth 6 -print
            exit 1
          fi

          rm -rf "$IPA_OUTPUT_DIR/Payload"
          mkdir -p "$IPA_OUTPUT_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_OUTPUT_DIR/Payload/"

          cd "$IPA_OUTPUT_DIR"
          /usr/bin/zip -r "$IPA_NAME" Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: telescopure-unsigned-ipa
          path: ${{ env.IPA_OUTPUT_DIR }}/${{ env.IPA_NAME }}
          if-no-files-found: error
